<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="gpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDBA74" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Circle -->
  <rect width="512" height="512" rx="128" fill="url(#gpGrad)"/>
  
  <!-- Food Dome / Cloche -->
  <circle cx="256" cy="180" r="28" fill="#FFFFFF" />
  <path d="M128 320 C128 220, 384 220, 384 320 Z" fill="#FFFFFF" opacity="0.95"/>
  <rect x="110" y="320" width="292" height="24" rx="12" fill="url(#amberGrad)"/>
  
  <!-- Steaming Aroma Curves -->
  <path d="M220 130 C220 100, 240 90, 230 60" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M256 125 C256 95, 276 85, 266 55" stroke="#FDBA74" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M292 130 C292 100, 312 90, 302 60" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" fill="none"/>

  <!-- Brand Typography -->
  <text x="256" y="405" font-family="'Outfit', sans-serif" font-size="52" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">GHARPOCH</text>
  <text x="256" y="445" font-family="'Noto Sans Devanagari', sans-serif" font-size="28" font-weight="700" fill="#FED7AA" text-anchor="middle">घरपोच</text>
</svg>
